[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notes-forge"
version = "0.1.0"
description = "Turn messy study notes into clear, fact-checked notes with diagrams."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.60",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
notes-forge = "notes_forge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["notes_forge"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
